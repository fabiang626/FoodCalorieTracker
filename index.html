<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>

<h1>Food Calorie Tracker</h1>

<div class="summary-card">
    <h2>Total Calories</h2>
    <p id="total-calories">0</p>
</div>

<form id="food-form">

    <label for="food-name">Food Name</label>
    <input
        type="text"
        id="food-name"
        placeholder="Enter food name">

    <label for="food-calories">Calories</label>
    <input
        type="number"
        id="food-calories"
        placeholder="Enter calories">

    <button type="submit">
        Add Food
    </button>

</form>

<p id="form-message"></p>

<h2>Food Log</h2>

<ul id="food-list">

</ul>

<script src="script.js"></script>

</body>
