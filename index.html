<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Calorie Tracker</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Food Calorie Tracker</h1>

    <div class="summary-card">
        <h2>Total Calories</h2>
        <p id="total-calories">0</p>

        <!-- Daily Calorie Goal -->
        <h2>Daily Calorie Goal</h2>
        <p id="daily-goal-display">No goal set</p>
    </div>

    <h2>Remaining Calories</h2>
    <p id="remaining-calories">0</p>

    <p id="remaining-message"></p>

    <!-- Goal Entry Form -->
    <form id="goal-form">

        <h2>Set Your Daily Goal</h2>

        <label for="calorie-goal">Enter Calorie Goal</label>

        <input
            type="number"
            id="calorie-goal"
            placeholder="Enter daily calorie goal"
            min="1"
            step="1"
            required
        >

        <button type="submit">
            Save Goal
        </button>

        <p id="goal-message"></p>

    </form>

    <!-- Food Entry Form -->
    <form id="food-form">

        <h2>Add Food</h2>

        <label for="food-name">Food Name</label>
        <input
            type="text"
            id="food-name"
            placeholder="Enter food name"
        >

        <label for="food-calories">Calories</label>
        <input
            type="number"
            id="food-calories"
            placeholder="Enter calories"
        >

        <button type="submit">
            Add Food
        </button>

    </form>

    <p id="form-message"></p>

    <h2>Food Log</h2>

    <ul id="food-list"></ul>

    <script src="script.js"></script>

</body>
</html>
